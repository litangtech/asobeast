name: Build web deployment image
on:
  push:
    branches:
      - "codex/web-deploy-*"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and export the web image
        run: |
          set -euo pipefail
          image="asobeast-web-deploy:${GITHUB_SHA:0:12}"
          docker build --file apps/web/Dockerfile --tag "$image" .
          docker image save "$image" | zstd -T2 -o asobeast-web.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: asobeast-web-${{ github.sha }}
          path: asobeast-web.tar.zst
          if-no-files-found: error
          retention-days: 7
